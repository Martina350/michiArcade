<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Demo Michi Game</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #051633;
        color: #e0f7ff;
        font-family: 'Courier New', monospace;
      }
      button {
        border: 4px solid #ffd54f;
        background: #0d47a1;
        color: #ffd54f;
        padding: 16px 32px;
        font-size: 18px;
        cursor: pointer;
      }
      button:hover {
        background: #1565c0;
      }
    </style>
  </head>
  <body>
    <h1>🐱 Demo Minijuego</h1>
    <p>Presiona para simular victoria</p>
    <button type="button" id="win">¡GANÉ!</button>
    <script>
      document.getElementById('win').addEventListener('click', () => {
        window.parent.postMessage({ status: 'game_completed' }, '*')
      })
    </script>
  </body>
</html>
